<!DOCTYPE html>
<html>
<head>
  <title>Certificate Verification</title>
  <style>
    body {
      margin: 0;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      color: #1a237e;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      letter-spacing: 0.5px;
    }

    /* MAIN WRAPPER */
    .container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }

    /* CARD */
    .card {
      background: white;
      padding: 25px;
      border-radius: 6px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    /* CERTIFICATE */
    .certificate {
      width: 900px;
      max-width: 95%;
      border-radius: 4px;
    }

    /* VERIFIED BADGE */
    .verified {
      margin-top: 15px;
      font-size: 16px;
      color: #2e7d32;
      font-weight: 600;
    }

    /* FOOTER INFO */
    .meta {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="header">
AICTE EduSkills Virtual Internship Verification Portal
</div>

<div class="container">
  <div class="card">

    <img src="certificate.png" class="certificate" />

    <div class="verified">✔ Verified Certificate</div>

    <div class="meta">
      Certificate ID: 4b94acf294879eefac01
    </div>

  </div>
</div>

</body>
</html>
